[theme]
# cores do design system "Contratação Pública"
base = "light"
primaryColor = "#1f4e8c"
backgroundColor = "#f7f6f2"
secondaryBackgroundColor = "#eeece6"
textColor = "#18202b"
font = "sans serif"

[server]
headless = true
# não vigiar ficheiros: evita problemas conhecidos entre o Streamlit e o torch
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
